name: Send Windows events

on:
  workflow_dispatch:
    inputs:
      targets_secret_name:
        description: GitHub secret containing the JSON list of Windows targets
        required: true
        type: string

permissions:
  contents: read

jobs:
  send-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Send Windows events to all communities
        env:
          TARGETS_JSON: ${{ secrets[inputs.targets_secret_name] }}
        run: |
          if [[ -z "$TARGETS_JSON" ]]; then
            echo "The requested target secret was not found or is empty." >&2
            exit 1
          fi
          bash scripts/sendwindowsdata_2.sh
