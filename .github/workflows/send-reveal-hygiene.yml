name: Send Reveal hygiene data

on:
  workflow_dispatch:
    inputs:
      targets_secret_name:
        description: GitHub secret containing the JSON list of Endpoint Agent intake targets
        required: true
        type: string

permissions:
  contents: read

jobs:
  send-reveal-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Send Reveal hygiene data to all communities
        env:
          TARGETS_JSON: ${{ secrets[inputs.targets_secret_name] }}
        run: |
          if [[ -z "$TARGETS_JSON" ]]; then
            echo "The requested Reveal target secret was not found or is empty." >&2
            exit 1
          fi
          bash scripts/send_reveal_hygiene.sh
